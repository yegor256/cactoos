---
# yamllint disable rule:line-length
name: markdown-lint
'on':
  push:
    branches:
      - master
    paths:
      - '**.md'
      - '.github/workflows/markdown-lint.yml'
  pull_request:
    branches:
      - master
    paths:
      - '**.md'
      - '.github/workflows/markdown-lint.yml'
jobs:
  markdown-lint:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24.2.0
